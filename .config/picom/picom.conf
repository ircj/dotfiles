#############################################
# picom — Tokyo Night rice
# Debian 11 / XFCE / Citrix, GEEN GPU:
#   - xrender backend (CPU), geen glx/blur/animaties
#   - alleen lichte transparantie + zachte schaduw + ronde hoeken
#############################################

# ---- Backend (CPU-vriendelijk, Citrix-proof) ----
backend = "xrender";
vsync = false;
# glx-specifieke opties bewust weggelaten; geen blur (blur vereist glx/dual_kawase).

# ---- Shadows (subtiel) ----
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.35;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-color = "#15161e";

shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "_GTK_FRAME_EXTENTS@:c",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# ---- Corners ----
corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'xfce4-panel'"
];

# ---- Opacity (zeer subtiel) ----
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

opacity-rule = [
  "92:class_g = 'kitty' && focused",
  "88:class_g = 'kitty' && !focused",
  "95:class_g = 'Xfce4-panel'"
];

# ---- Fading (uit: kan laggen over Citrix) ----
fading = false;

# ---- Wintypes ----
wintypes:
{
  tooltip     = { shadow = false; };
  dock        = { shadow = false; };
  dnd         = { shadow = false; };
  popup_menu  = { shadow = true; opacity = 0.95; };
  dropdown_menu = { shadow = true; opacity = 0.95; };
};

# ---- Overige ----
detect-rounded-corners = true;
detect-client-opacity = true;
use-ewmh-active-win = true;
detect-transient = true;
