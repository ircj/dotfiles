-- Tokyo Night conky — Debian 11 / XFCE / Citrix (geen GPU, geen nvidia/batterij)
-- vim: ts=4 sw=4 noet ai cindent syntax=lua

conky.config = {
    -- Window
    own_window = true,
    own_window_type = 'desktop',
    own_window_class = 'Conky',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_argb_visual = true,
    own_window_argb_value = 170,
    own_window_colour = '1a1b26',
    double_buffer = true,

    -- Placement
    alignment = 'top_right',
    gap_x = 30,
    gap_y = 50,
    minimum_width = 300,
    minimum_height = 5,

    -- Drawing
    border_width = 0,
    draw_borders = false,
    draw_graph_borders = true,
    draw_outline = false,
    draw_shades = false,
    stippled_borders = 0,

    -- Font (Nerd Font voor glyphs)
    use_xft = true,
    font = 'JetBrainsMono Nerd Font:size=10',
    xftalpha = 1,
    override_utf8_locale = true,

    -- Colours (Tokyo Night)
    default_color = 'c0caf5',        -- foreground
    color1 = '7aa2f7',               -- blue (headers)
    color2 = '9ece6a',               -- green
    color3 = 'e0af68',               -- yellow
    color4 = 'bb9af7',               -- purple
    color5 = '7dcfff',               -- cyan
    color6 = '565f89',               -- muted

    -- Behaviour
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    no_buffers = true,
    update_interval = 2.0,
    uppercase = false,
    use_spacer = 'none',
    extra_newline = false,
    out_to_console = false,
    out_to_stderr = false,
}

conky.text = [[
${color1}${font JetBrainsMono Nerd Font:bold:size=28}${alignc}${time %H:%M}${font}${color}
${color6}${alignc}${time %A %d %B %Y}${color}

${color1} SYSTEM ${hr 2}${color}
${color5}${color} Host${alignr}${nodename}
${color5}${color} Kernel${alignr}${kernel}
${color5}${color} Uptime${alignr}${uptime}

${color1} CPU ${hr 2}${color}
${color5}${color} ${execi 3600 grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | cut -c1-28}
${color5}${color} Usage${alignr}${cpu cpu0}%
${cpubar cpu0 6}
${color5}${color} Load${alignr}${loadavg 1} ${loadavg 2} ${loadavg 3}
${color6}Top:${color} ${top name 1}${alignr}${top cpu 1}%
${color6}    ${color} ${top name 2}${alignr}${top cpu 2}%
${color6}    ${color} ${top name 3}${alignr}${top cpu 3}%

${color1} MEMORY ${hr 2}${color}
${color5}${color} RAM${alignr}${mem} / ${memmax}
${membar 6}
${color6}Top:${color} ${top_mem name 1}${alignr}${top_mem mem_res 1}
${color6}    ${color} ${top_mem name 2}${alignr}${top_mem mem_res 2}
${color6}    ${color} ${top_mem name 3}${alignr}${top_mem mem_res 3}

${color1} DISK ${hr 2}${color}
${color5}${color} Root${alignr}${fs_used /} / ${fs_size /}
${fs_bar 6 /}
${color5}${color} Home${alignr}${fs_used /home} / ${fs_size /home}
${fs_bar 6 /home}

${color1} NETWORK ${hr 2}${color}
${color5}${color} IP${alignr}${addr ens3}
${color5}${color} Down${alignr}${downspeed ens3}
${color2}${downspeedgraph ens3 24,140 1a1b26 7aa2f7}${color}
${color5}${color} Up${alignr}${upspeed ens3}
${color3}${upspeedgraph ens3 24,140 1a1b26 e0af68}${color}

${color1} PROCESSES ${hr 2}${color}
${color5}${color} Total${alignr}${processes}
${color5}${color} Running${alignr}${running_processes}
]]
