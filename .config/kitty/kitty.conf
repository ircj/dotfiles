# kitty configuration — Tokyo Night rice (Debian 11 / XFCE / Citrix, no GPU)
# Font
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        11.0

# Rendering — keep it light for a GPU-less Citrix session
sync_to_monitor       no
repaint_delay         14
input_delay           3
wayland_enable_ime    no

# Cursor
cursor_shape          beam
cursor_blink_interval 0

# Scrollback
scrollback_lines      10000

# Bell
enable_audio_bell     no
visual_bell_duration  0

# Window
remember_window_size   yes
window_padding_width   8
hide_window_decorations no
confirm_os_window_close 0

# Tab bar
tab_bar_edge          bottom
tab_bar_style         powerline
tab_powerline_style   slanted

# Opacity — fully opaque (no compositor over Citrix, avoids lag)
background_opacity     1.0

# Load the Tokyo Night colour scheme
include                tokyonight.conf
